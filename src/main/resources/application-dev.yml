spring:
  config:
    import:
      - optional:aws-secretsmanager:/dev/application/twilio/credentials?prefix=twilio.
      - optional:aws-secretsmanager:dev/database/credentials?prefix=database.
  datasource:
    url: jdbc:sqlserver://theseasonneverendswl.c4uijqbxxtmv.us-east-2.rds.amazonaws.com:1433;databaseName=TSNE_WL;encrypt=true;trustServerCertificate=true;hostNameInCertificate=*.rds.amazonaws.com
    username: ${database.username}
    password: ${database.password}

  jpa:
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    # Forces the UI to fetch config relative to its current path
    config-url: /notification-service/v3/api-docs/swagger-config
    url: /notification-service/v3/api-docs
