spring:
  cloud:
    aws:
      region:
        static: us-east-2
  application:
    name: league-commissioner-notification-service
#  config:
#    import:
#      - optional:aws-secretsmanager:/dev/application/twilio/credentials?prefix=twilio.
#      - optional:aws-secretsmanager:dev/database/credentials?prefix=database.
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    properties:
      hibernate:
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

aws:
  region: us-east-2
  s3:
    reports: league-draft-reports
    events: league-event-flyers
    media: league-venue-media

server:
  servlet:
    context-path: /notification-service

springdoc:
  api-docs:
    enabled: false

scheduler:
  account:
    login-history: 0 0 0 * * *

management:
  endpoints:
    web:
      exposure:
        include: "health"
  endpoint:
    health:
      show-details: "never"


#twilio:
#  account:
#    sid: account-sid
#    auth-token: auth-token
#  sendgrid:
#    fromEmail: ${twilio.sgSourceEmail}
#    sgApikey: ${twilio.sgApiKey}

logging:
  level:
    org.springframework.boot.actuate.health: DEBUG
    org.springframework.boot.actuate.endpoint: DEBUG
